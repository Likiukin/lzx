<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李兆昕 · 个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #fefefc;
      background-image:
        repeating-linear-gradient(0deg, rgba(120,160,190,.28) 0 1px, transparent 1px 32px),
        repeating-linear-gradient(90deg, rgba(120,160,190,.28) 0 1px, transparent 1px 32px);
      font-family: 'Noto Sans SC', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1b2a4a;
    }
    .card {
      max-width: 600px;
      width: 100%;
      background: rgba(254,254,252,.88);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(27,42,74,.15);
      border-radius: 32px;
      padding: 56px 44px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(27,42,74,.08);
      transition: transform .3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1b2a4a, #3a4a6b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      color: #fefefc;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(27,42,74,.15);
    }
    .badge {
      display: inline-block;
      background: #e23f35;
      color: #fefefc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 18px;
      color: #3a4a6b;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 14px 40px;
      border-radius: 999px;
      background: #1b2a4a;
      color: #fefefc;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      border: 2px solid #1b2a4a;
      transition: all .25s ease;
      box-shadow: 0 4px 12px rgba(27,42,74,.15);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(226,63,53,.25);
      background: #e23f35;
      border-color: #e23f35;
    }
    .links {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .links a {
      color: #3a4a6b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: border-color .2s;
    }
    .links a:hover {
      border-bottom-color: #e23f35;
    }
    .footer-note {
      margin-top: 36px;
      font-size: 12px;
      color: #aab;
    }
    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 26px; }
      .avatar { width: 72px; height: 72px; font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">李</div>
    <div class="badge">✦ 学生成长记录</div>
    <h1>李兆昕</h1>
    <p class="sub">
      对代码、设计和世界充满好奇<br>
      日照第一中学 · 海曲校区
    </p>
    <a href="portfolio.html" class="btn">进入我的成长主页 →</a>
    <div class="links">
      <a href="mailto:a776234813@outlook.com">📧 邮箱</a>
      <a href="#">💬 微信</a>
      <a href="#">🔗 GitHub</a>
    </div>
    <div class="footer-note">—— 持续生长，保持热爱 ——</div>
  </div>
</body>
</html>
