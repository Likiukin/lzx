<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="description" content="双维度跑酷：在两个维度之间切换，穿越不同的平台与陷阱，抵达终点。" />
<title>双维度跑酷 · Dual Dimension Runner</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <!-- ===== 标题界面 ===== -->
  <div class="screen" id="screen-title">
    <div class="panel title-panel">
      <h1 class="logo">双维度跑酷</h1>
      <div class="logo-sub">DUAL DIMENSION RUNNER</div>
      <div class="controls-help">
        <div class="help-row"><span class="key">← →</span><span>移动</span><span class="key">空格 / W</span><span>跳跃</span></div>
        <div class="help-row"><span class="key">Q / E / Shift</span><span>切换维度</span><span class="key">P / Esc</span><span>暂停</span></div>
        <div class="help-row"><span class="key">R</span><span>重开本关</span><span class="key">M</span><span>静音</span></div>
      </div>
      <div class="dim-legend">
        <span class="legend-item"><i class="dot dot-bright"></i>亮之维度：青色平台与陷阱</span>
        <span class="legend-item"><i class="dot dot-dark"></i>暗之维度：橙色平台与陷阱</span>
      </div>
      <div id="level-select" class="level-select"></div>
      <div class="btn-row">
        <button id="btn-start" class="btn btn-primary">开始游戏</button>
        <button id="btn-mute-title" class="btn">声音：开</button>
      </div>
    </div>
  </div>

  <!-- ===== 暂停 ===== -->
  <div class="screen hidden" id="screen-pause">
    <div class="panel">
      <h2>已暂停</h2>
      <div class="btn-row column">
        <button id="btn-resume" class="btn btn-primary">继续游戏</button>
        <button id="btn-restart" class="btn">重新开始本关</button>
        <button id="btn-title" class="btn">返回标题</button>
      </div>
    </div>
  </div>

  <!-- ===== 通关 ===== -->
  <div class="screen hidden" id="screen-complete">
    <div class="panel">
      <h2 class="complete-title">通关成功！</h2>
      <div id="complete-stars" class="stars"></div>
      <div class="complete-stats">
        <div>用时：<span id="complete-time">0.0</span> 秒</div>
        <div>金币：<span id="complete-coins">0</span> / <span id="complete-coins-total">0</span></div>
      </div>
      <div class="btn-row column">
        <button id="btn-next" class="btn btn-primary">下一关</button>
        <button id="btn-replay" class="btn">重玩本关</button>
        <button id="btn-title-complete" class="btn">返回标题</button>
      </div>
    </div>
  </div>

  <!-- ===== 触摸控制（移动端） ===== -->
  <div id="touch-controls" class="hidden">
    <div class="touch-zone touch-left">
      <button class="touch-btn" id="touch-left" aria-label="向左"><span>◀</span></button>
      <button class="touch-btn" id="touch-right" aria-label="向右"><span>▶</span></button>
    </div>
    <div class="touch-zone touch-right">
      <button class="touch-btn touch-jump" id="touch-jump" aria-label="跳跃"><span>▲</span></button>
      <button class="touch-btn touch-switch" id="touch-switch" aria-label="切换维度"><span>⇄</span></button>
    </div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
